version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obrasci
      POSTGRES_PASSWORD: obrasci
      POSTGRES_DB: obrasci
    ports:
      - "5432:5432"
    volumes:
      - obrasci_pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=obrasci;Username=obrasci;Password=obrasci"
    ports:
      - "8080:8080"

volumes:
  obrasci_pgdata:
